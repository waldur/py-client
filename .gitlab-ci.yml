include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/verify-generated-artifact.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/sbom/publish-sboms-to-github-release.yml"

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key:
    files:
      - poetry.lock
  paths:
    - .uv-cache/

stages:
  - test
  - release
  - publish

Fetch OpenAPI schema:
  extends: .fetch-openapi-schema

Build Python SDK:
  stage: test
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  script:
    - pip install uv
    - uv pip install --system git+https://github.com/waldur/openapi-python-client.git pyyaml
    - rm -rf gen-client waldur_api_client
    - openapi-python-client generate --path waldur-openapi-schema.yaml --output-path gen-client --overwrite --meta poetry
    - python scripts/generate_llm_docs.py waldur-openapi-schema.yaml gen-client/
    - cp -a gen-client/waldur_api_client waldur_api_client
    - cp gen-client/llms.txt llms.txt
    - cp gen-client/llms-full.txt llms-full.txt
    - cp gen-client/api-map.md api-map.md
    # The packaged copies are the ones shipped to PyPI via pyproject.toml `include`.
    - cp gen-client/llms.txt gen-client/llms-full.txt gen-client/api-map.md waldur_api_client/
    - rm -rf gen-client
    - echo "Compiling generated Python module..."
    - python -m py_compile $(find waldur_api_client -name "*.py")
  artifacts:
    paths:
      - waldur_api_client/
      - llms.txt
      - llms-full.txt
      - api-map.md
      - waldur-openapi-schema.yaml
    expire_in: 1 day

# The 8.1.0 client was generated from the 8.0.9 schema — the fetch had silently
# fallen back — so it contained none of that release's 234 new operations and
# every job still went green. This compares what was generated against what was
# asked for, before it can be released.
Verify generated client:
  extends: .verify-generated-artifact
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
    - job: Build Python SDK
      artifacts: true
  variables:
    GENERATED_DIR: "waldur_api_client"

Release Python SDK:
  stage: release
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Build Python SDK
      artifacts: true
    # Gate the release on the check, so a stale client cannot be published.
    - job: Verify generated client
      artifacts: false
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Authenticate origin with token for pushing back commits & tags
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      if [ -n "$RELEASE_VERSION" ]; then
        sed -i 's/^version = "[^"]*"/version = "'$RELEASE_VERSION'"/' pyproject.toml
        git add pyproject.toml waldur_api_client llms.txt llms-full.txt api-map.md
        git diff --cached --quiet && echo "py-client version already set" || git commit -m "Release: bump version and update code to $RELEASE_VERSION"
        git tag -a $RELEASE_VERSION -m "Release version $RELEASE_VERSION" || echo "Tag $RELEASE_VERSION already exists"
        git push origin $RELEASE_VERSION || echo "Tag $RELEASE_VERSION already pushed"
      else
        git add waldur_api_client llms.txt llms-full.txt api-map.md
        git diff --cached --quiet && echo "No changes" || git commit -m "chore: nightly update of Waldur Python SDK"
      fi
    - git push origin HEAD:main || echo "main branch already up to date"

Publish Dev to PyPI:
  stage: publish
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION == ""'
  needs:
    - job: Build Python SDK
      artifacts: true
  script:
    - pip install uv
    - uv pip install --system poetry
    - |
      DEV_VERSION=$(python3 -c "
      import re, sys
      version = '0.0.0'
      try:
          with open('waldur-openapi-schema.yaml', 'r') as f:
              for line in f:
                  m = re.match(r'^\s*version:\s*[\"\'\']?([^\"\'\']+)[\"\'\']?', line)
                  if m:
                      version = m.group(1).strip()
                      break
      except Exception:
          pass
      version = version.replace('-rc.', 'rc').replace('-rc', 'rc')
      version = version.replace('.dev.', '.dev').replace('-dev.', '.dev')
      if 'dev' not in version:
          version = f'{version}.dev{sys.argv[1]}'
      print(version)
      " "$CI_PIPELINE_IID")
      echo "Publishing dev version: $DEV_VERSION"
      poetry version "$DEV_VERSION"
    - poetry build
    - poetry config pypi-token.pypi "$PYPI_TOKEN"
    - poetry publish --no-interaction

Publish Release to PyPI:
  stage: publish
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: Build Python SDK
      artifacts: true
    # Gate the registry publish too, not just the tag. These jobs use `needs`,
    # so a satisfied dependency lets them run even while another job in an
    # earlier stage is failing — which is exactly how the SDK jobs published
    # during 8.1.0 while the schema job was red.
    - job: Verify generated client
      artifacts: false
  script:
    - pip install uv
    - uv pip install --system poetry
    - poetry version "$RELEASE_VERSION"
    - poetry build
    - poetry config pypi-token.pypi "$PYPI_TOKEN"
    - poetry publish --no-interaction

# `Release Python SDK` pushes the release tag, which starts a pipeline of its
# own at the release commit; the SBOM jobs run there.
Generate Codebase SBOM:
  stage: release
  # Pinned: the tool that produces supply-chain evidence should not float.
  image: registry.hpc.ut.ee/mirror/astral/uv:0.12.19-python3.13-alpine
  rules: !reference [.Publish SBOMs to GitHub release template, rules]
  interruptible: true
  allow_failure: true
  cache: []
  variables:
    PROJECT_NAME: waldur-api-client
  script:
    - apk add --no-cache jq
    # No lockfile is committed and the dependencies are declared the poetry way,
    # which `uv export` cannot read, so resolve them as an install of this release
    # would today. Without the 3.9 floor uv takes the running interpreter as the
    # lowest version and drops the backports older Pythons need.
    - uv pip compile pyproject.toml --universal --python-version 3.9 -o requirements.txt
    - uvx --from cyclonedx-bom==7.4.0 cyclonedx-py requirements requirements.txt --spec-version 1.5 -o requirements.cyclonedx.json
    # Requirements mode leaves the root component empty.
    - jq --arg name "$PROJECT_NAME" --arg version "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" '.metadata.component = {type:"library","bom-ref":$name,name:$name,version:$version}' requirements.cyclonedx.json > ${PROJECT_NAME}-${CI_COMMIT_TAG}-source.cyclonedx.json
    - tar -czf ${PROJECT_NAME}-${CI_COMMIT_TAG}-source.cyclonedx.tar.gz ${PROJECT_NAME}-${CI_COMMIT_TAG}-source.cyclonedx.json
  artifacts:
    paths:
      - ${PROJECT_NAME}-${CI_COMMIT_TAG}-source.cyclonedx.tar.gz
    expire_in: 90 days

Publish SBOMs to GitHub release:
  extends: .Publish SBOMs to GitHub release template
  stage: publish
  variables:
    PROJECT_NAME: waldur-api-client
    SBOM_TYPES: "source"
